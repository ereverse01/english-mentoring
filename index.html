<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 독해 멘토링</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#22262e; --sub:#6b7280; --line:#e5e1d8;
  --pri:#3b6fe0; --pri2:#e8efff; --ok:#16a34a; --okbg:#e7f7ec; --bad:#dc2626; --badbg:#fdecec;
  --yel:#fff19a; --grn:#bff0c8; --blu:#cfe1ff; --pink:#ffd6e7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:17px;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:700}
button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
button.soft{background:var(--pri2);color:var(--pri)}
button.small{padding:6px 12px;font-size:14px;border-radius:10px}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hbar{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px}
.who{margin-left:auto;font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center}
.stk-count{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:800;color:var(--ink)}
.tabs{display:flex;gap:6px;max-width:960px;margin:0 auto;padding:0 16px 8px;overflow-x:auto}
.tab{background:transparent;color:var(--sub);padding:8px 14px;border-radius:99px;font-weight:700;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}
h2{margin:0 0 10px;font-size:20px}
h3{margin:0 0 8px;font-size:17px}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:99px;font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step-no{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin-right:6px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:transform .1s}
.pcard:hover{transform:translateY(-2px)}
.pcard .t{font-weight:800;font-size:17px;line-height:1.35}
.slots{display:flex;gap:4px;margin-top:8px}
.slot{width:34px;height:34px;border-radius:10px;background:#f1efe9;display:flex;align-items:center;justify-content:center;font-size:20px;border:1.5px dashed #d8d3c7}
.slot.got{background:#fff8d6;border:1.5px solid #f2d36b}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stepb{background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:8px 12px;border-radius:12px;font-weight:700;white-space:nowrap;font-size:15px}
.stepb.on{border-color:var(--ink);background:var(--ink);color:#fff}
.stepb.done{background:#fff8d6;border-color:#f2d36b}
.stepb.on.done{background:var(--ink);border-color:var(--ink)}
.stepb.lock{opacity:.5}
.en{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.7}
.sbox{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:#fffefb}
.sbox .num{font-weight:800;color:var(--pri);margin-right:6px}
.model{background:var(--okbg);border-radius:10px;padding:8px 12px;margin-top:8px}
.score{font-weight:800;font-size:18px}
.key{display:inline-block;padding:1px 8px;border-radius:99px;font-size:14px;margin:2px;font-weight:700}
.key.hit{background:var(--okbg);color:var(--ok)}
.key.miss{background:#f1f1f1;color:#999;text-decoration:line-through}
.selfb{display:flex;gap:6px;margin-top:8px}
.selfb button{padding:4px 10px;font-size:14px;background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.selfb button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:#fffefb}
.q .qt{font-weight:800;margin-bottom:8px}
.qtext{font-family:Georgia,serif;font-size:18px;line-height:1.75;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qtext u{text-decoration-thickness:2px;text-underline-offset:3px}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--ink);margin:0 4px}
.obox{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;background:#fff}
.choice{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);margin:6px 0;font-weight:500;font-family:Georgia,serif;font-size:17px}
.choice:disabled{opacity:1}
.nums{display:flex;gap:8px}.nums .choice{text-align:center;flex:1;font-size:20px}
.choice.on{border-color:var(--pri);background:var(--pri2)}
.choice.right{border-color:var(--ok);background:var(--okbg)}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.explain{background:#f7f5f0;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.passage{font-family:Georgia,serif;font-size:19px;line-height:2;user-select:none;-webkit-user-select:none}
.passage sup{font-family:system-ui;font-size:11px;color:var(--pri);font-weight:800;margin-right:2px}
.w{border-radius:4px;padding:1px 0;cursor:pointer}
.w.k,.gap.k{background:#ffc6de}
.w.r,.gap.r{background:var(--grn)}
.u{text-decoration:underline;text-decoration-color:#ec4899;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-skip-ink:none}
.bk{font-weight:800;font-size:22px;padding:0 1px;font-family:system-ui,sans-serif}
.bk.n{color:#2563eb}
.bk.m{color:#7c3aed}
.w.sel{outline:2px dashed #7c3aed;outline-offset:1px}
#hlBox{position:relative;line-height:2.6}
svg.arr{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.penhelp{background:#f7f5f0;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.dnode .ds{margin-top:4px;font-family:Georgia,serif;font-size:15px}
.dnode .ds span{text-decoration:underline;text-decoration-color:#ec4899;text-decoration-thickness:2px;text-underline-offset:4px}
.w.v{background:var(--blu);box-shadow:0 0 0 2px #8db4ff inset}
.w.hint{text-decoration:underline wavy #f59e0b}
.pens{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pen{background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:700}
.pen.on{border-color:var(--ink)}
.roles .rrow{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:8px 0}
.roles .rrow .s{font-family:Georgia,serif;font-size:15px}
.diagram{display:flex;flex-direction:column;align-items:stretch;gap:0}
.dtopic{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700}
.dnode{border:2px solid;border-radius:14px;padding:8px 12px;background:#fff}
.dnode .rl{font-weight:800}
.dnode .rs{font-size:13px;color:var(--sub);margin-left:6px}
.dnode .kw{margin-top:4px}
.dnode .kw span{display:inline-block;background:#ffc6de;border-radius:4px;padding:0 5px;margin:2px 3px 0 0;font-family:Georgia,serif;font-size:15px}
.dnode .kw span.r{background:var(--grn)}
.arrow{text-align:center;color:var(--sub);font-size:18px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.two{grid-template-columns:1fr}.roles .rrow{grid-template-columns:1fr}}
.vlist{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:160px 1fr 40px;gap:8px;align-items:center}
.vrow b{font-family:Georgia,serif;font-size:18px}
.vrow button{padding:6px;background:#fff;color:var(--bad);border:1.5px solid var(--line)}
@media (max-width:560px){.vrow{grid-template-columns:1fr 40px}.vrow input{grid-column:1/-1;grid-row:2}}
.gw{position:relative;border-bottom:2px dotted #9aa8c7;cursor:help}
.gw:hover::after,.gw.show::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--ink);color:#fff;font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:15px;font-weight:600;line-height:1.4;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:15;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.gw:hover,.gw.show{background:#eef3ff}
.vpairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px}
.vpair{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding:6px 2px}
.vpair b{font-family:Georgia,serif;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fcard{height:110px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer;position:relative}
.fcard .fw{font-family:Georgia,serif;font-size:21px;font-weight:700}
.fcard.flip{background:#fff8d6;border-color:#f2d36b}
.fcard .ck{position:absolute;top:6px;right:8px;font-size:14px}
.test{max-width:560px;margin:0 auto;text-align:center}
.test .big{font-family:Georgia,serif;font-size:32px;font-weight:700;margin:14px 0}
.test .bigk{font-size:24px;font-weight:800;margin:14px 0}
.test .choice{font-family:inherit;text-align:center}
.bar{height:8px;background:#ece8de;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.fb{border-radius:12px;padding:10px;margin:10px 0;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
th{color:var(--sub);font-weight:700;font-size:13px}
td.l,th.l{text-align:left}
.tscroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-size:13px;color:var(--sub);font-weight:700}
.cal .d{aspect-ratio:1/1;border-radius:12px;background:#fff;border:1px solid var(--line);padding:4px;font-size:13px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal .d .n{position:absolute;top:3px;left:6px;color:var(--sub);font-weight:700}
.cal .d.on{background:#fff4f4;border:2px solid #f19a9a}
.cal .d.on .stamp{color:#d33;font-weight:900;font-size:13px;border:2px solid #d33;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
.cal .d.today{outline:2px solid var(--pri)}
.cal .d .plus{font-size:11px;color:var(--sub);margin-top:2px}
.board{display:flex;flex-wrap:wrap;gap:6px;font-size:30px}
.board span{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#fff8d6;border-radius:12px;border:1px solid #f2d36b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:60}
#pop.show{display:flex}
#pop .in{background:#fff;border-radius:24px;padding:26px 34px;text-align:center;animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
#pop .s{font-size:90px;line-height:1.1;animation:spin .8s ease}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{from{transform:rotate(-30deg) scale(.6)}to{transform:none}}
.lock-msg{text-align:center;padding:30px;color:var(--sub)}
.sync{font-size:12px}
.login{max-width:420px;margin:60px auto}
.login label{display:block;font-weight:700;margin:12px 0 4px}
.prompt-step{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin:12px 0}
.hint-box{background:#fffbe6;border:1px solid #f4e3a1;border-radius:12px;padding:10px 12px;font-size:14px}
.tg td{font-size:14px}
.tg .yes{color:var(--ok);font-weight:900}
.clickrow{cursor:pointer}
.clickrow:hover{background:#faf8f3}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="pop" onclick="this.classList.remove('show')"><div class="in"><div class="s" id="popS"></div><div id="popT" style="font-weight:800;font-size:20px;margin-top:6px"></div><div class="muted" style="margin-top:6px">눌러서 닫기</div></div></div>
<script>
// ▼ 구글 시트 Apps Script 웹 앱 주소 (비워 두면 이 기기에만 저장)
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzeHKNek5s__wQ-b1LSt_99WX1j0JB75xesQNg52P5Ib-udDH3xOGGW72msUCLbEULP-Q/exec";

const STEPS = [
  { k: "tr", n: "문장 번역", i: "✍️" },
  { k: "quiz", n: "수능형 문제", i: "📝" },
  { k: "struct", n: "주제·구조", i: "🖍️" },
  { k: "voc", n: "단어장", i: "📒" },
  { k: "test", n: "단어 시험", i: "🧪" },
  { k: "re", n: "오답 재시험", i: "🔁" },
];
const STICKERS = ["🌟","🍀","🐬","🦄","🍓","🚀","🌈","🐱","🎈","🍩","🦊","🌻","🐼","⚡","🎵","🍉","🐧","💎","🐳","🍒","🦋","🐥","🍭","🌙","🔥","🎯","🐨","🌸","🍋","🐙"];
const LEVELS = {
  "중1": { d: "Korean middle school 1st grade (CEFR A1-A2): short simple sentences, very common words", s: [6, 7], w: [70, 100] },
  "중2": { d: "Korean middle school 2nd grade (CEFR A2): simple and some compound sentences", s: [6, 8], w: [90, 120] },
  "중3": { d: "Korean middle school 3rd grade (CEFR A2-B1): some relative clauses and to-infinitives", s: [7, 8], w: [110, 140] },
  "고1": { d: "Korean high school 1st grade mock-test level (CEFR B1)", s: [7, 9], w: [130, 160] },
  "고2": { d: "Korean high school 2nd grade mock-test level (CEFR B1-B2)", s: [7, 9], w: [140, 170] },
  "고3": { d: "Korean CSAT (수능) level (CEFR B2): abstract academic topic", s: [7, 10], w: [150, 190] },
};
const TOPICS = ["자유", "과학", "환경", "심리", "사회·문화", "기술·IT", "건강", "예술", "스포츠", "역사", "경제", "교육", "언어", "동물·자연"];
const TOPIC_EN = { "자유": "any interesting topic for teenagers", "과학": "science", "환경": "environment", "심리": "psychology", "사회·문화": "society and culture", "기술·IT": "technology and IT", "건강": "health", "예술": "art", "스포츠": "sports", "역사": "history", "경제": "economics", "교육": "education and learning", "언어": "language", "동물·자연": "animals and nature" };
const ROLES = ["도입", "주제문", "근거", "예시", "대조·반론", "부연", "결론"];
const ROLE_COLOR = { "도입": "#9ca3af", "주제문": "#e11d74", "근거": "#3b6fe0", "예시": "#0d9488", "대조·반론": "#ea580c", "부연": "#7c3aed", "결론": "#ca8a04" };
const ORDERS = ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"];
const STOP = new Set("a an the and or but so to of in on at for with by from as is are was were be been being am it its this that these those they them their there then than he she his her we our you your i me my not no do does did can could will would should may might must have has had if when while which who whom whose what where why how about into over after before also just very more most such only other some any all each one two".split(" "));
const NUMS = "①②③④⑤";

// ───────────────── 저장 ─────────────────
const ME_KEY = "eng-mentor-me";
let S = null;      // { me:{sid,name}, passages:[], att:{date:{n,st}} }
let V = { tab: "home", pid: null, step: "tr", pen: "k", lv: "고1", tp: "자유", aiShow: false, flip: {} };
let T = null;      // 단어 시험 진행 상태

function dataKey(sid) { return "eng-mentor-v1:" + sid; }
function boot() {
  let me = null;
  try { me = JSON.parse(localStorage.getItem(ME_KEY) || "null"); } catch (e) {}
  if (me) S = loadData(me);
  if (location.hash === "#teacher") return teacherView();
  render();
  if (S && SHEET_URL) pull();
}
function loadData(me) {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(dataKey(me.sid)) || "null"); } catch (e) {}
  d = d || { passages: [], att: {} };
  d.me = me;
  d.passages = d.passages || []; d.att = d.att || {};
  return d;
}
function saveLocal() {
  if (!S) return;
  try { localStorage.setItem(dataKey(S.me.sid), JSON.stringify({ passages: S.passages, att: S.att })); } catch (e) { toast("기기 저장 공간이 부족해요"); }
}
function touch(p) { p.updated = Date.now(); saveLocal(); queuePush(p); }

// ───────────────── 구글 시트 동기화 ─────────────────
let pushTimers = {}, syncState = SHEET_URL ? "" : "local";
async function api(body) {
  const r = await fetch(SHEET_URL, { method: "POST", body: JSON.stringify(body) });
  return r.json();
}
function queuePush(p) {
  if (!SHEET_URL || !S) return;
  clearTimeout(pushTimers[p.id]);
  setSync("wait");
  pushTimers[p.id] = setTimeout(() => pushNow(p), 1200);
}
async function pushNow(p) {
  const day = today();
  try {
    const r = await api({
      action: "save", sid: S.me.sid, name: S.me.name,
      p: {
        id: p.id, title: p.d.title, level: p.level, created: p.created,
        steps: STEPS.filter(s => p.st[s.k]).map(s => s.n).join(", "),
        st: stCount(p), tr: trAvg(p), quiz: p.quiz.score == null ? "" : p.quiz.score,
        test: p.test.score == null ? "" : p.test.score, data: JSON.stringify(p),
      },
      att: S.att[day] ? { date: day, n: S.att[day].n, st: S.att[day].st } : null,
    });
    setSync(r.ok ? "ok" : "err");
  } catch (e) { setSync("err"); }
}
async function pull() {
  setSync("wait");
  try {
    const r = await api({ action: "load", sid: S.me.sid, name: S.me.name });
    if (!r.ok) { setSync("err"); return; }
    let changed = false;
    (r.rows || []).forEach(row => {
      let p; try { p = JSON.parse(row.data); } catch (e) { return; }
      if (!p || !p.id) return;
      const i = S.passages.findIndex(x => x.id === p.id);
      if (i < 0) { S.passages.push(p); changed = true; }
      else if ((S.passages[i].updated || 0) < (p.updated || 0)) { S.passages[i] = p; changed = true; }
    });
    (r.att || []).forEach(a => {

// 문장 → 토큰
function toks(s) { return String(s).match(/[A-Za-z]+(?:['’-][A-Za-z]+)*|[^A-Za-z]+/g) || []; }
function isW(t) { return /^[A-Za-z]/.test(t); }
function norm(w) { return String(w).toLowerCase().replace(/[’]/g, "'").replace(/[^a-z' -]/g, "").replace(/\s+/g, " ").trim(); }
function stems(w) {
  w = norm(w); const out = new Set([w]);
  [["ies", "y"], ["ied", "y"], ["ing", ""], ["ing", "e"], ["ed", ""], ["ed", "e"], ["es", ""], ["s", ""], ["ly", ""], ["er", ""], ["est", ""], ["'s", ""]].forEach(([a, b]) => {
    if (w.endsWith(a) && w.length - a.length >= 3) {
      const base = w.slice(0, -a.length);
      out.add(base + b);
      if (/(.)\1$/.test(base)) out.add(base.slice(0, -1));
    }
  });
  return [...out];
}
function passageHTML(p, clsFn) {
  return p.d.sentences.map((s, i) => '<span class="sent"><sup>' + (i + 1) + "</sup>" +
    toks(s.en).map((t, j) => isW(t) ? '<span class="w ' + clsFn(i, j, t) + '" data-i="' + i + '" data-j="' + j + '">' + esc(t) + "</span>" : esc(t)).join("") + "</span> ").join("");
}
// 한국어 비교
function bigrams(s) { s = String(s).replace(/[^가-힣a-zA-Z0-9]/g, ""); const a = []; for (let i = 0; i < s.length - 1; i++) a.push(s.slice(i, i + 2)); if (s.length === 1) a.push(s); return a; }
function sim(a, b) {
  const A = bigrams(a), B = bigrams(b); if (!A.length || !B.length) return 0;
  const m = new Map(); B.forEach(x => m.set(x, (m.get(x) || 0) + 1));
  let c = 0; A.forEach(x => { if (m.get(x) > 0) { c++; m.set(x, m.get(x) - 1); } });
  return 2 * c / (A.length + B.length);
}
function keyHit(key, ans) {
  const k = String(key).replace(/[^가-힣a-zA-Z0-9]/g, ""), a = String(ans).replace(/[^가-힣a-zA-Z0-9]/g, "");
  if (!k) return true;
  if (a.includes(k)) return true;
  const stem = k.slice(0, Math.max(2, k.length - 2));
  if (k.length >= 2 && a.includes(stem)) return true;
  const kb = bigrams(k), ab = new Set(bigrams(a));
  return kb.length >= 2 && kb.filter(x => ab.has(x)).length / kb.length >= 0.6;
}
function gradeOne(s, ans) {
  const keys = s.keys || [];
  const hits = keys.map(k => keyHit(k, ans));
  const kr = keys.length ? hits.filter(Boolean).length / keys.length : null;
  const sm = Math.min(1, sim(ans, s.ko) / 0.55);
  const score = Math.round(100 * (kr == null ? sm : 0.7 * kr + 0.3 * sm));
  return { score, hits };
}

function gradePrompt(p) {

function parseJSON(txt) {
  let t = String(txt).trim();
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (f) t = f[1];
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("{ … } 모양의 답을 찾지 못했어요. ChatGPT 답 전체를 복사했는지 확인해 주세요.");
  t = t.slice(a, b + 1);
  try { return JSON.parse(t); }
  catch (e) {
    const t2 = t.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, "$1");
    try { return JSON.parse(t2); } catch (e2) { throw new Error("답의 형식이 깨져 있어요. ChatGPT에 '올바른 JSON으로 다시 줘'라고 말한 뒤 다시 붙여넣어 보세요."); }
  }
}
function buildPassage(o, lv, tp) {
  const sents = (o.sentences || []).filter(s => s && s.en).map(s => ({ en: String(s.en).trim(), ko: String(s.ko || "").trim(), keys: Array.isArray(s.keys) ? s.keys.map(String).filter(Boolean).slice(0, 5) : [] }));
  if (sents.length < 3) throw new Error("문장(sentences)이 너무 적어요. 다시 받아 주세요.");
  const qs = (o.questions || []).filter(q => q && Array.isArray(q.choices) && q.choices.length === 5 && +q.answer >= 1 && +q.answer <= 5)
    .map(q => ({ type: String(q.type || "문제"), q: String(q.q || ""), text: q.text ? String(q.text) : "", choices: q.choices.map(String), answer: +q.answer, explain: String(q.explain || "") }));
  const ord = orderQuestion(sents);
  if (ord) { const at = qs.findIndex(q => q.type === "어법"); qs.splice(at < 0 ? qs.length : at, 0, ord); }
  const st = o.structure || {};
  let roles = Array.isArray(st.roles) ? st.roles.map(String) : [];
  roles = sents.map((_, i) => ROLES.includes(roles[i]) ? roles[i] : (roles[i] || ""));
  return {
    id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    created: today(), createdAt: Date.now(), updated: Date.now(), level: lv, tp,
    d: {

      topic: { ko: String((o.topic && o.topic.ko) || o.topic || ""), en: String((o.topic && o.topic.en) || "") },
      keywords: (o.keywords || []).map(String), repeated: (o.repeated || []).map(String),
      structure: { type: String(st.type || ""), roles, summary: String(st.summary || "") },
      questions: qs,
      vocab: (o.vocab || []).filter(v => v && v.w).map(v => ({ w: String(v.w).trim(), m: String(v.m || "").trim() })),
    },
    tr: { a: [], sc: [], hits: [], self: [], gpt: null },
    quiz: { a: {}, done: false, score: null },
    struct: { hl: {}, topic: "", roles: [], done: false },
    voc: { list: [], done: false, known: {} },

function orderQuestion(sents) {
  const n = sents.length;

  const m = rest.length, c1 = Math.ceil(m / 3), c2 = Math.ceil((m - c1) / 2);
  const chunks = [rest.slice(0, c1), rest.slice(c1, c1 + c2), rest.slice(c1 + c2)];
  if (chunks.some(c => !c.length)) return null;
  const ans = Math.floor(Math.random() * 5);
  const labels = ORDERS[ans].match(/[ABC]/g); // 정답 순서대로 붙일 이름
  const boxes = {};
  chunks.forEach((c, i) => { boxes[labels[i]] = c.join(" "); });
  return {
    type: "순서", q: "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",
    given: sents.slice(0, head).map(s => s.en).join(" "), boxes,
    choices: ORDERS.slice(), answer: ans + 1,
    explain: "글의 흐름: " + ORDERS[ans] + ". 연결어, 대명사(this, they 등), 앞에서 나온 내용을 다시 가리키는 말을 단서로 순서를 찾아요.",
  };
}

// 1. 문장 번역
function skimDone(p) { return (p.skim && p.skim.done) || p.tr.sc.some(x => x != null); }
function preDone(p) { return p.pre || skimDone(p); }
function vPre(p) {
  const pairs = p.d.vocab.map(v => `<div class="vpair"><b>${esc(v.w)}</b><span>${esc(v.m)}</span></div>`).join("");
  return `<div class="card"><h2>📖 먼저 단어부터 훑어봐요</h2>

function finishPre() { const p = cur(); p.pre = true; V.preEdit = false; markAtt(false); touch(p); render(); window.scrollTo(0, 0); }
function vSkim(p) {

function finishSkim() {

}
function vTr(p) {
  if (!preDone(p) || V.preEdit) return vPre(p);

  const done = p.tr.sc.filter(x => x != null).length, n = p.d.sentences.length;
  const sk = p.skim || {};
  const skimBox = p.skim ? `<div class="card" style="padding:12px 18px"><div class="row" style="justify-content:space-between"><b>👀 훑어 읽고 내가 쓴 것</b><span class="row"><button class="ghost small" onclick="V.preEdit=true;render()">📖 단어 다시 보기</button><button class="ghost small" onclick="V.skimEdit=true;render()">고치기</button></span></div>
    <div class="muted">키워드: ${esc(sk.kw || "(비워 둠)")} · 주제: ${esc(sk.topic || "(비워 둠)")}</div></div>` : "";
  const rows = p.d.sentences.map((s, i) => {
    const sc = p.tr.sc[i];
    let res = "";
    if (sc != null) {
      const hits = p.tr.hits[i] || [];
      const g = p.tr.gpt && p.tr.gpt[i];
      res = `<div class="row" style="margin-top:8px"><span class="score">${sc >= 85 ? "⭐" : sc >= 60 ? "👍" : "💪"} ${sc}점</span>

        ${s.keys.length ? `<div style="margin-top:4px"><span class="muted">핵심어 </span>${s.keys.map((k, x) => `<span class="key ${hits[x] ? "hit" : "miss"}">${esc(k)}</span>`).join("")}</div>` : ""}

        <div class="selfb"><span class="muted">스스로 평가</span>${["⭕ 같은 뜻", "🔺 조금 달라요", "❌ 틀렸어요"].map((l, x) => `<button class="${p.tr.self[i] === x ? "on" : ""}" onclick="selfEval(${i},${x})">${l}</button>`).join("")}</div>`;
    }

  }).join("");
  return `${skimBox}<div class="card"><h2>✍️ 문장 하나하나 번역하기</h2>
    <div class="muted">한 문장씩 한국어로 써 보고 <b>채점하기</b>를 눌러요. 핵심어가 들어갔는지, 모범 번역과 얼마나 비슷한지로 점수를 매겨요. 뜻이 같으면 표현은 달라도 괜찮아요!</div>

    <div class="muted">내 번역과 모범 번역을 ChatGPT에게 보내 문장마다 코멘트를 받아요.</div>

}
function glossHTML(p, en) {
  return toks(en).map(t => {
    if (!isW(t)) return esc(t);
    const g = gloss(p, t);
    if (!g) return esc(t);
    const tip = norm(g.w) === norm(t) ? g.m : g.w + " : " + g.m;
    return `<span class="gw" tabindex="0" data-tip="${esc(tip)}">${esc(t)}</span>`;
  }).join("");
}
document.addEventListener("click", e => {
  const g = e.target.closest && e.target.closest(".gw");
  document.querySelectorAll(".gw.show").forEach(x => { if (x !== g) x.classList.remove("show"); });
  if (g) g.classList.toggle("show");
});
function trInput(i, v) { const p = cur(); p.tr.a[i] = v; saveLocal(); }
function gradeTr(i, quiet) {
  const p = cur(), a = (p.tr.a[i] || "").trim();
  if (!a) { if (!quiet) toast(i + 1 + "번 문장을 먼저 번역해 주세요"); return false; }
  const g = gradeOne(p.d.sentences[i], a);
  p.tr.sc[i] = g.score; p.tr.hits[i] = g.hits;

  return true;
}
function gradeAll() {
  const p = cur(); let empty = 0;
  p.d.sentences.forEach((_, i) => { if (!gradeTr(i, true)) empty++; });
  if (empty) toast("아직 안 쓴 문장이 " + empty + "개 있어요");
  afterTr(p);
}
function afterTr(p) {

  render();
}
function selfEval(i, x) { const p = cur(); p.tr.self[i] = x; touch(p); render(); }
function addGpt() {
  const p = cur();
  try {
    const o = parseJSON(document.getElementById("gIn").value);
    const g = [];
    (o.results || []).forEach(r => { const n = +r.n - 1; if (n >= 0 && n < p.d.sentences.length) g[n] = { score: r.score, comment: r.comment || "" }; });
    if (!g.length) throw new Error("results 를 찾지 못했어요");

// 2. 수능형 문제
function qText(t) {
  return esc(t).replace(/([①②③④⑤])\s*\[([^\]]+)\]/g, "<u><b>$1</b> $2</u>").replace(/_{3,}/g, '<span class="blank"></span>');
}
function vQuiz(p) {
  const qs = p.d.questions;
  if (!qs.length) return `<div class="card lock-msg">이 지문에는 문제가 없어요.</div>`;
  const sub = p.quiz.done;
  const html = qs.map((q, qi) => {
    const pick = p.quiz.a[qi];
    let body = "";
    if (q.type === "순서") body = `<div class="qtext">${esc(q.given)}</div>` + ["A", "B", "C"].map(l => `<div class="obox en" style="font-size:17px"><b>(${l})</b> ${esc(q.boxes[l])}</div>`).join("");
    else if (q.text) body = `<div class="qtext">${qText(q.text)}</div>`;
    const ch = q.choices.map((c, ci) => {
      let cls = pick === ci + 1 ? "on" : "";
      if (sub) cls = ci + 1 === q.answer ? "right" : pick === ci + 1 ? "wrong" : "";
      const label = /^[①②③④⑤]$/.test(c.trim()) ? c : NUMS[ci] + " " + esc(c);
      return `<button class="choice ${cls}" ${sub ? "disabled" : ""} onclick="pickQ(${qi},${ci + 1})">${label}</button>`;
    }).join("");
    const res = sub ? `<div class="fb ${pick === q.answer ? "ok" : "no"}">${pick === q.answer ? "⭕ 정답!" : "❌ 정답은 " + NUMS[q.answer - 1]}</div><div class="explain">💡 ${esc(q.explain)}</div>` : "";
    const numOnly = q.choices.every(c => /^[①②③④⑤]$/.test(c.trim()));
    return `<div class="q"><div class="qt"><span class="badge">${esc(q.type)}</span> ${qi + 1}. ${esc(q.q)}</div>${body}<div class="${numOnly ? "nums" : ""}">${ch}</div>${res}</div>`;
  }).join("");
  const answered = Object.keys(p.quiz.a).length;
  return `<div class="card"><h2>📝 수능형 문제</h2>
    ${sub ? `<div class="fb ok" style="font-size:18px">${p.quiz.score}점 (${qs.filter((q, i) => p.quiz.a[i] === q.answer).length}/${qs.length})</div>` : `<div class="muted">모두 풀고 제출하면 바로 채점하고 해설을 보여 줘요.</div>`}
    ${html}
    <div class="row">${sub ? `<button class="ghost" onclick="retryQuiz()">🔄 다시 풀기</button>` : `<button onclick="submitQuiz()" ${answered < qs.length ? "disabled" : ""}>제출하기 (${answered}/${qs.length})</button>`}</div></div>`;
}
function pickQ(qi, c) { const p = cur(); if (p.quiz.done) return; p.quiz.a[qi] = c; saveLocal(); render(); }
function submitQuiz() {
  const p = cur(), qs = p.d.questions;
  const right = qs.filter((q, i) => p.quiz.a[i] === q.answer).length;
  p.quiz.score = Math.round(right / qs.length * 100); p.quiz.done = true;
  earn(p, "quiz"); render();
}
function retryQuiz() { const p = cur(); p.quiz.a = {}; p.quiz.done = false; touch(p); render(); window.scrollTo(0, 0); }

const PENS = [["k", "🩷 키워드 형광펜"], ["u", "〰️ 키워드 서술 밑줄"], ["r", "🟩 반복 표현"], ["n", "[ ] 긴 명사구"], ["m", "( ) 수식어구·절 ↷"], ["x", "🧽 지우개"]];

function structHTML(p) {
  const st = p.struct, hl = st.hl, ul = st.ul || {}, br = st.br || [], sel = V.sel;
  return p.d.sentences.map((s, i) => {

     ${STEPS.map(s => `<td style="font-size:22px">${p.st[s.k] || '<span style="color:#ccc">⬜</span>'}</td>`).join("")}<td style="font-size:22px">${stCount(p) === 6 ? "🏆" : ""}</td></tr>`).join("");
  return `<div class="card"><h2>🏅 나의 진도표</h2>
    <div class="stats"><div class="stat"><b>${all.length}</b>모은 스티커</div><div class="stat"><b>${S.passages.length}</b>공부한 지문</div><div class="stat"><b>${full}</b>완주한 지문 🏆</div><div class="stat"><b>${Object.keys(S.att).length}</b>출석한 날</div></div>
    <div style="margin-top:14px"><div class="row" style="justify-content:space-between"><span class="muted">다음 목표: 스티커 ${next}개</span><span class="muted">${all.length}/${next}</span></div><div class="bar"><i style="width:${Math.min(100, all.length / next * 100)}%"></i></div></div></div>
  <div class="card"><h3>지문별 진도</h3>
    ${S.passages.length ? `<div class="tscroll"><table><tr><th class="l">지문</th>${STEPS.map((s, i) => `<th>${i + 1}<br>${s.n}</th>`).join("")}<th>완주</th></tr>${rows}</table></div>` : '<div class="muted">아직 공부한 지문이 없어요.</div>'}</div>
  <div class="card"><h3>내 스티커 판</h3>${all.length ? `<div class="board">${all.map(s => `<span>${s}</span>`).join("")}</div>` : '<div class="muted">단계를 하나 끝낼 때마다 스티커가 붙어요!</div>'}</div>`;
}

// ── 출석부
function viewAttend() {
  const base = V.month ? new Date(V.month + "-01T00:00:00") : new Date();
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  const ym = y + "-" + String(m + 1).padStart(2, "0");
  const t = today();
  let cells = ["일", "월", "화", "수", "목", "금", "토"].map(d => `<div class="h">${d}</div>`).join("");
  for (let i = 0; i < first; i++) cells += "<div></div>";
  let cnt = 0;
  for (let d = 1; d <= days; d++) {
    const key = ym + "-" + String(d).padStart(2, "0"), a = S.att[key];
    if (a) cnt++;
    cells += `<div class="d ${a ? "on" : ""} ${key === t ? "today" : ""}"><span class="n">${d}</span>${a ? `<span class="stamp">출석</span><span class="plus">${a.st ? "스티커 " + a.st : "활동 " + a.n}</span>` : ""}</div>`;
  }
  let streak = 0; const d0 = new Date();
  if (!S.att[t]) d0.setDate(d0.getDate() - 1);
  for (;;) { const k = d0.getFullYear() + "-" + String(d0.getMonth() + 1).padStart(2, "0") + "-" + String(d0.getDate()).padStart(2, "0"); if (!S.att[k]) break; streak++; d0.setDate(d0.getDate() - 1); }
  return `<div class="card"><h2>📅 출석부</h2><div class="muted">그날 공부 활동을 하나라도 하면 자동으로 출석 도장이 찍혀요.</div>
    <div class="stats" style="margin-top:10px"><div class="stat"><b>${cnt}</b>${m + 1}월 출석</div><div class="stat"><b>${streak}</b>연속 출석 🔥</div><div class="stat"><b>${Object.keys(S.att).length}</b>전체 출석</div></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="ghost small" onclick="moveMonth(-1)">◀</button><h3 style="margin:0">${y}년 ${m + 1}월</h3><button class="ghost small" onclick="moveMonth(1)">▶</button></div>
    <div class="cal">${cells}</div></div>`;
}
function moveMonth(k) { const b = V.month ? new Date(V.month + "-01T00:00:00") : new Date(); b.setDate(1); b.setMonth(b.getMonth() + k); V.month = b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0"); render(); }

// ── 렌더 후 이벤트 연결
function afterRender() {
  document.querySelectorAll("[data-tr]").forEach(el => el.oninput = () => trInput(+el.dataset.tr, el.value));
  document.querySelectorAll("[data-role]").forEach(el => el.onchange = () => { const p = cur(); p.struct.roles[+el.dataset.role] = el.value; touch(p); render(); });
  document.querySelectorAll("[data-vm]").forEach(el => el.oninput = () => { const p = cur(); p.voc.list[+el.dataset.vm].m = el.value; touch(p); });
  const ti = document.getElementById("topicIn"); if (ti) ti.oninput = () => { const p = cur(); p.struct.topic = ti.value; touch(p); };
  const hb = document.getElementById("hlBox");
  if (hb) {
    hb.onclick = e => { const w = e.target.closest(".w"); if (w) structTap(+w.dataset.i, +w.dataset.j); };
    drawArrows();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawArrows);
  }
  const vb = document.getElementById("vocBox");
  if (vb) vb.onclick = e => { const w = e.target.closest(".w"); if (w) tapVoc(+w.dataset.i, +w.dataset.j); };
  const tIn = document.getElementById("tIn"); if (tIn && !tIn.disabled) tIn.focus();
  const nb = document.getElementById("nextB"); if (nb) nb.focus();
}

// ───────────────── 선생님 화면 ─────────────────
let TD = null;
function teacherView() {
  const app = document.getElementById("app");
  if (!SHEET_URL) { app.innerHTML = `<div class="wrap"><div class="card login"><h2>👩‍🏫 선생님 화면</h2><p>아직 구글 시트가 연결되지 않았어요. index.html 의 SHEET_URL 을 채워 주세요.</p><a href="./">학생 화면으로</a></div></div>`; return; }
  if (!TD) {
    app.innerHTML = `<div class="wrap"><div class="card login"><h2>👩‍🏫 선생님 화면</h2><label>교사 암호</label><input id="tpw" type="password" onkeydown="if(event.key==='Enter')tLoad()"><button style="width:100%;margin-top:12px" onclick="tLoad()">들어가기</button>
      <div class="muted" style="margin-top:10px;text-align:center"><a href="./" onclick="setTimeout(()=>location.reload(),0)">학생 화면으로</a></div></div></div>`;
    const pw = sessionStorage.getItem("em-tpw"); if (pw) { document.getElementById("tpw").value = pw; tLoad(); }
    return;
  }
  const by = {};
  TD.rows.forEach(r => { const s = by[r.sid] || (by[r.sid] = { sid: r.sid, name: r.name, ps: [], att: {} }); s.ps.push(r); s.name = r.name; });
  TD.att.forEach(a => { const s = by[a.sid] || (by[a.sid] = { sid: a.sid, name: a.name, ps: [], att: {} }); s.att[a.date] = a; });
  const studs = Object.values(by).sort((a, b) => a.sid.localeCompare(b.sid));
  const dates = [...new Set(TD.att.map(a => a.date))].sort().slice(-14);
  const f = (TD.filter || "").trim();
  const shown = studs.filter(s => !f || s.sid.startsWith(f) || s.name.includes(f));
  const rows = shown.map(s => {
    const st = s.ps.reduce((n, p) => n + (+p.st || 0) + (+p.st === 6 ? 1 : 0), 0);
    const full = s.ps.filter(p => +p.st === 6).length;
    const open = TD.open === s.sid;
    const det = open ? `<tr><td colspan="${6 + dates.length}" style="background:#faf8f3"><table class="tg"><tr><th class="l">지문</th><th>수준</th><th>시작일</th><th>완료 단계</th><th>스티커</th><th>번역</th><th>문제</th><th>단어</th><th>저장</th></tr>
      ${s.ps.map(p => `<tr><td class="l">${esc(p.title)}</td><td>${esc(p.level)}</td><td>${esc(p.created)}</td><td class="l" style="font-size:13px">${esc(p.steps)}</td><td>${p.st}/6</td><td>${esc(p.tr)}</td><td>${esc(p.quiz)}</td><td>${esc(p.test)}</td><td style="font-size:12px">${esc(String(p.time).slice(0, 16).replace("T", " "))}</td></tr>`).join("")}</table></td></tr>` : "";
    return `<tr class="clickrow" onclick="TD.open=TD.open==='${s.sid}'?null:'${s.sid}';teacherView()"><td>${esc(s.sid)}</td><td class="l"><b>${esc(s.name)}</b></td><td>${s.ps.length}</td><td>${full}</td><td>🏅 ${st}</td><td>${Object.keys(s.att).length}</td>
      ${dates.map(d => `<td class="${s.att[d] ? "yes" : ""}">${s.att[d] ? "✔" : ""}</td>`).join("")}</tr>${det}`;
  }).join("");
  app.innerHTML = `<header><div class="hbar"><div class="logo">👩‍🏫 영어 독해 멘토링 · 선생님</div><div class="who"><button class="ghost small" onclick="tLoad()">새로고침</button><button class="ghost small" onclick="tCopy()">엑셀용 복사</button></div></div></header>
  <div class="wrap"><div class="card"><div class="row"><input id="tf" placeholder="학번 앞자리(예: 103)나 이름으로 찾기" value="${esc(f)}" style="max-width:320px"><span class="muted">학생 ${shown.length}명 · 줄을 누르면 지문별 기록</span></div>
    <div class="tscroll" style="margin-top:10px"><table class="tg"><tr><th>학번</th><th class="l">이름</th><th>지문</th><th>완주</th><th>스티커</th><th>출석일</th>${dates.map(d => `<th>${d.slice(5).replace("-", "/")}</th>`).join("")}</tr>${rows}</table></div></div></div>`;
  const tf = document.getElementById("tf");
  tf.oninput = () => { TD.filter = tf.value; const pos = tf.selectionStart; teacherView(); const n = document.getElementById("tf"); n.focus(); n.setSelectionRange(pos, pos); };
}
async function tLoad() {
  const el = document.getElementById("tpw");
  const pw = el ? el.value : sessionStorage.getItem("em-tpw");
  if (!pw) return;
  toast("불러오는 중…");
  try {
    const r = await api({ action: "list", pw });
    if (!r.ok) { sessionStorage.removeItem("em-tpw"); TD = null; teacherView(); return toast(r.error === "pw" ? "암호가 달라요" : "불러오지 못했어요"); }
    sessionStorage.setItem("em-tpw", pw);
    TD = Object.assign(TD || {}, { rows: r.rows, att: r.att });
    teacherView();
  } catch (e) { toast("연결에 실패했어요"); }
}
function tCopy() {
  const lines = [["학번", "이름", "지문", "수준", "시작일", "완료 단계", "스티커", "번역 평균", "문제 점수", "단어시험", "마지막 저장"].join("\t")];
  TD.rows.forEach(p => lines.push([p.sid, p.name, p.title, p.level, p.created, p.steps, p.st, p.tr, p.quiz, p.test, p.time].join("\t")));
  lines.push("", ["날짜", "학번", "이름", "활동 수", "받은 스티커"].join("\t"));
  TD.att.forEach(a => lines.push([a.date, a.sid, a.name, a.n, a.st].join("\t")));
  copyText(lines.join("\n")).then(ok => toast(ok ? "복사했어요. 엑셀에 붙여넣으세요" : "복사 실패"));
}
